<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BLG MAFIA</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

:root {

  --red: #e01924;

  --black: #080808;

  --dark: #151515;

  --grey: #242424;

  --white: #ffffff;

}

* {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

}

body {

  background: var(--black);

  color: var(--white);

  font-family: Arial, sans-serif;

  padding-bottom: 95px;

}

header {

  text-align: center;

  padding: 25px 15px;

  border-bottom: 2px solid var(--red);

  background: #101010;

}

.logo {

  max-width: 150px;

  max-height: 120px;

  object-fit: contain;

  margin-bottom: 10px;

}

header h1 {

  color: var(--red);

  font-size: 28px;

  letter-spacing: 3px;

}

header p {

  color: #aaa;

  font-size: 12px;

  margin-top: 7px;

}

main {

  max-width: 700px;

  margin: auto;

  padding: 18px;

}

.section-title {

  color: var(--red);

  font-size: 21px;

  margin: 15px 0;

  text-transform: uppercase;

}

.categories {

  display: grid;

  grid-template-columns: repeat(3, 1fr);

  gap: 8px;

  margin-bottom: 25px;

}

.category-btn {

  background: var(--dark);

  color: white;

  border: 1px solid var(--red);

  border-radius: 8px;

  padding: 13px 5px;

  font-weight: bold;

  cursor: pointer;

}

.category-btn.active {

  background: var(--red);

}

.products {

  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 12px;

}

.product {

  background: var(--dark);

  border: 1px solid #333;

  border-radius: 10px;

  padding: 15px;

  text-align: center;

}

.product h3 {

  margin-bottom: 8px;

  font-size: 16px;

}

.product p {

  color: #aaa;

  font-size: 13px;

  margin-bottom: 12px;

}

.demo-label {

  display: inline-block;

  color: #aaa;

  font-size: 11px;

  border: 1px solid #444;

  padding: 5px 9px;

  border-radius: 20px;

  margin-top: 8px;

}

.gallery {

  margin-top: 30px;

}

.video-placeholder {

  background: #151515;

  border: 1px solid var(--red);

  border-radius: 10px;

  padding: 45px 15px;

  text-align: center;

  margin-top: 12px;

}

.video-placeholder .icon {

  font-size: 38px;

  margin-bottom: 12px;

}

.video-placeholder h3 {

  color: var(--red);

  letter-spacing: 2px;

  font-size: 17px;

}

.video-placeholder p {

  color: #999;

  font-size: 12px;

  margin-top: 10px;

}

.cart-box {

  background: var(--dark);

  border: 1px solid var(--red);

  border-radius: 10px;

  padding: 15px;

  margin-top: 20px;

}

.cart-item {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 8px;

  border-bottom: 1px solid #333;

  padding: 12px 0;

  font-size: 14px;

}

.quantity-controls {

  display: flex;

  align-items: center;

  gap: 8px;

}

.quantity-controls button {

  background: var(--red);

  color: white;

  border: none;

  border-radius: 5px;

  width: 29px;

  height: 29px;

  font-size: 18px;

  cursor: pointer;

}

.remove-btn {

  background: #333;

  color: white;

  border: none;

  padding: 7px 10px;

  border-radius: 5px;

  cursor: pointer;

}

.total {

  color: var(--red);

  font-size: 20px;

  font-weight: bold;

  text-align: right;

  margin-top: 18px;

}

.demo-note {

  color: #999;

  font-size: 12px;

  text-align: center;

  margin-top: 15px;

  line-height: 1.5;

}

nav {

  position: fixed;

  bottom: 0;

  left: 0;

  width: 100%;

  display: flex;

  gap: 8px;

  padding: 12px 8px;

  background: #101010;

  border-top: 2px solid var(--red);

  z-index: 100;

}

.navbtn {

  flex: 1;

  background: #202020;

  color: white;

  border: 1px solid var(--red);

  border-radius: 8px;

  padding: 12px 5px;

  font-size: 14px;

  cursor: pointer;

}

.navbtn:active,

.category-btn:active,

.quantity-controls button:active {

  transform: scale(0.96);

}

.hidden {

  display: none;

}

@media (max-width: 380px) {

  .navbtn {

    font-size: 12px;

  }

  .categories {

    grid-template-columns: 1fr;

  }

}

</style>

</head>

<body>

<header>

  <img

    src="blg-logo.jpeg"

    alt="BLG Logo"

    class="logo"

    onerror="this.style.display='none'"

  >

  <h1>BLG MAFIA</h1>

<main>

  <div id="products" class="products"></div>

  <div class="gallery">

    <h2 class="section-title">🎬 Galerie vidéo</h2>

    <div class="video-placeholder">

      <div class="icon">🎥</div>

      <h3>VIDÉO EN COURS D'ARRIVÉE</h3>

      <p>Notre galerie vidéo sera bientôt disponible.</p>

    </div>

  </div>

<section id="cartPage" class="hidden">

  <h2 class="section-title">🛒 Mon panier</h2>

  <div class="cart-box">

    <div id="cartItems">

      <p class="demo-note">Ton panier est vide.</p>

    </div>

    <div class="total">

      Total : <span id="cartTotal">0</span> €

    </div>

    <p class="demo-note">

      Panier de démonstration uniquement.

      Aucune commande ou transaction n'est effectuée.

    </p>

  </div>

</section>

</main>

<nav>

  <button class="navbtn" onclick="goHome()">

    🏠 <b>Boutique</b>

  </button>

  <button class="navbtn" onclick="showCart()">

    🛒 <b>Panier</b>

    (<span id="cartCount">0</span>)

  </button>

  <button class="navbtn" onclick="openContact()">

    📱 <b>Contact</b>

  </button>

</nav>
