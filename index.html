<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">

<title>BLG INDUSTRY | DIRECTION</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">

<style>

:root {
  color-scheme: dark;
  --red: #e01924;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background-color: #090909;
  background-image:
    linear-gradient(
      rgba(0,0,0,.28),
      rgba(0,0,0,.38)
    ),
    url('./background-storm.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: white;
  font-family: 'Black Ops One', cursive;
}

body * {
  font-family: 'Black Ops One', cursive;
}

header {
  text-align: center;
  padding: 24px 16px;
}

header img {
  width: min(190px,55vw);
  height: auto;
}

h1 {
  font-size: 32px;
  font-weight: 400;
  letter-spacing: 2px;
  text-align: center;
  color: white;
  text-transform: uppercase;
  margin: 12px 0 6px;
  text-shadow: 0 0 8px rgba(255,255,255,.25);
}

.sub,
.section-title {
  color: #aaa;
  letter-spacing: 2px;
  font-size: 12px;
}

main {
  max-width: 620px;
  margin: auto;
  padding: 12px 18px 100px;
}

.section-title {
  margin: 18px 0;
}

/* CATÉGORIES */

.category {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  width: 100%;
  padding: 24px 18px;
  margin: 10px 0;
  background: linear-gradient(110deg,#151515,#1d1011,#151515);
  border: 1px solid var(--red);
  border-radius: 9px;
  color: white;
  text-align: left;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
  box-shadow: inset 0 0 18px #e0192418,
              0 0 10px #e019241c;
}

.category:before {
  content: "⚡";
  position: absolute;
  right: 45px;
  top: 4px;
  font-size: 45px;
  color: var(--red);
  opacity: .22;
  pointer-events: none;
}

.category:after {
  content: "⚡";
  position: absolute;
  right: 12px;
  bottom: -5px;
  font-size: 30px;
  color: #ff4650;
  opacity: .14;
  pointer-events: none;
}

.category span {
  float: right;
  color: var(--red);
  font-size: 24px;
}

/* CATALOGUE */

.back {
  background: none;
  border: 0;
  color: var(--red);
  padding: 12px 0;
  font-weight: bold;
  cursor: pointer;
}

.product,
.cart-row {
  background: #151515;
  border: 1px solid #333;
  border-radius: 9px;
  padding: 16px;
  margin: 10px 0;
}

.product {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.price {
  color: var(--red);
  font-weight: bold;
  margin-top: 6px;
}

.qty {
  display: flex;
  align-items: center;
  gap: 12px;
}

.qty button,
.remove {
  background: #222;
  border: 1px solid var(--red);
  color: white;
  border-radius: 6px;
  width: 34px;
  height: 34px;
  font-size: 20px;
  cursor: pointer;
}

.primary {
  padding: 14px;
  border-radius: 7px;
  background: var(--red);
  border: 0;
  color: white;
  width: 100%;
  font-weight: bold;
  margin-top: 12px;
  cursor: pointer;
}

.total {
  text-align: right;
  font-size: 22px;
  font-weight: bold;
  margin: 20px 2px;
}

.empty,
.notice {
  color: #888;
  text-align: center;
}

.notice {
  font-size: 11px;
  line-height: 1.5;
  margin: 28px 5px;
}

/* VIDÉOS */

.video-section {
  margin: 28px 0 18px;
  padding: 18px 14px;
  border: 1px solid #572027;
  border-radius: 10px;
  background: linear-gradient(145deg,#151515,#0c0c0c);
  box-shadow: 0 0 18px #e0192410;
}

.video-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 0;
  margin: 0;
  border: 0;
  background: none;
  color: white;
  text-align: left;
  cursor: pointer;
}

.video-mark {
  color: var(--red);
  font-size: 22px;
}

.video-card {
  background: #111;
  border: 1px solid #333;
  border-radius: 9px;
  padding: 10px;
  margin: 12px 0;
}

.video-card video {
  display: block;
  width: 100%;
  max-height: 520px;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  background: black;
  border-radius: 6px;
}

.video-name {
  font-weight: bold;
  letter-spacing: 1px;
  margin: 10px 2px 3px;
}

.video-empty {
  color: #888;
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
  padding: 14px 8px;
}

/* CONTACT */

.contact-btn,
.product-video {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 17px;
  margin: 18px 0;
  border: 1px solid #229ED9;
  border-radius: 9px;
  background: #10232e;
  color: white;
  text-decoration: none;
  font-weight: bold;
  letter-spacing: 1px;
  text-align: center;
}

.contact-btn span,
.product-video span {
  color: #70cfff;
  font-size: 14px;
}

/* NAVIGATION */

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #101010;
  border-top: 1px solid #333;
  display: flex;
  justify-content: center;
  gap: 18px;
  padding: 12px;
  z-index: 5;
}

.navbtn {
  background: none;
  border: 0;
  color: white;
  padding: 8px 16px;
  cursor: pointer;
}

.navbtn b {
  color: var(--red);
}

.hidden {
  display: none !important;
}

</style>
</head>

<body>

<header>
  <img src="blg-logo.jpeg" alt="BLG INDUSTRY">
  <h1>🥷BLG INDUSTRY🥷</h1>
  <div class="sub">DIRECTION</div>
</header>

<main>

<!-- ACCUEIL -->

<section id="home">

  <div class="section-title">
    CHOISIS TA CATÉGORIE
  </div>

  <button type="button" class="category"
  onclick="showCategory('🧼 La Mousse Top 🧼')">
    🧼 La Mousse Top 🧼 <span>›</span>
  </button>

  <button type="button" class="category"
  onclick="showCategory('🍫 DrySift 90u 🍫')">
    🍫 DrySift 90u 🍫 <span>›</span>
  </button>

  <button type="button" class="category"
  onclick="showCategory('🍁 HAZE 🍁')">
    🍁 HAZE 🍁 <span>›</span>
  </button>
  
 <button type="button" class="category"
onclick="toggleVideos()">
  📹 VIDÉOS PRODUITS HD 📹 <span>›</span>
</button>
<div id="videoGallery" style="display:none"></div>
    

  <a class="contact-btn"
  href="https://t.me/blgindustry1"
  target="_blank"
  rel="noopener">

    ✈️ CONTACT TELEGRAM ✈️
    <span>@blgindustry1</span>

  </a>

  <a class="product-video"
  href="https://t.me/+AvKneA-itAQyZDE0"
  target="_blank"
  rel="noopener">

    🥷📹 CANAL VIDÉO 📹🥷
    <span>CANAL TELEGRAM</span>

</a>



</section>

<!-- CATALOGUE -->

<section id="catalog" class="hidden">

  <button class="back" onclick="goHome()">
    ‹ RETOUR
  </button>

  <div class="section-title" id="catTitle"></div>

  <div id="products"></div>

</section>

<!-- PANIER -->

<section id="cart" class="hidden">

  <button class="back" onclick="goHome()">
    ‹ RETOUR À LA BOUTIQUE
  </button>

  <div class="section-title">
    MON PANIER
  </div>

  <div id="cartItems"></div>

  <div class="total" id="total"></div>

  </p>

</section>

<p class="notice">
  Produits vérifiés.
  Vente réservée aux adultes.
</p>

</main>

<nav>

  <button class="navbtn" onclick="goHome()">
    🏬 <b>Boutique</b>
  </button>

  <button class="navbtn" onclick="showCart()">
    🛒 <b>Panier</b>
    (<span id="cartCount">0</span>)
  </button>

</nav>

<script>

/* CATALOGUE */

const data = {

  '🧼 La Mousse Top 🧼': [
    {w:'3,3g',p:20,emoji:'🍫'},
    {w:'10 g',p:60,emoji:'🎰'},
    {w:'25 g',p:140,emoji:'⚡️'},
    {w:'50 g',p:240,emoji:'🎯'},
    {w:'100g',p:380,emoji:'🦂'}
  ],

  '🍫 DrySift 90u 🍫': [
    {w:'2,5g',p:20,emoji:'🧠'},
    {w:'7g',p:50,emoji:'🐍'},
    {w:'10g',p:80,emoji:'🦂'},
    {w:'25g',p:240,emoji:'💥'},
    {w:'50g',p:300,emoji:'🎾'},
    {w:'100g',p:500,emoji:'🎯'}
  ],

  '🍁 HAZE 🍁': [
    {w:'≈3g',p:20,emoji:'🎰'},
    {w:'6g',p:40,emoji:'🗽'},
    {w:'10g',p:70,emoji:'👽'},
    {w:'25g',p:240,emoji:'😈'},
    {w:'50g',p:350,emoji:'🫀'},
    {w:'100g',p:400,emoji:'🦂'}
  ]

};


/* VIDÉOS */

  const productVideos = [
  {
    title: 'Top Mousse 2k26 🎰',
    subtitle: 'La Mousse Top 👽',
    src: 'videos/La Mousse Top.mp4'
  },
  {
    title: '🦂NEW DROP DrySift 90u🦂',
    subtitle: 'Cherry Devils😈🐍',
    src: 'videos/Cherry Devils 😈 - copie - copie.mp4'
  }
];
function renderVideos() {

  const box = document.getElementById('videoGallery');

  if (!box) return;

  if (!productVideos.length) {

    box.innerHTML = `
      <div class="video-empty">
        Les vidéos arriveront ici.<br><br>
        Tout Arrivage sera Affiché Ici🥷
      </div>
    `;

    return;
  }

  box.innerHTML = productVideos.map(v => `

    <article class="video-card">

      <video controls playsinline preload="metadata">

        <source src="${v.src}" type="video/mp4">

        Ton navigateur ne peut pas lire cette vidéo.

      </video>

<div class="video-name">
  ${v.title}
</div>

<div class="sub">
  ${v.subtitle}
</div>

    </article>

  `).join('');

}

function toggleVideos() {

  const gallery = document.getElementById('videoGallery');

  if (!gallery) return;

  const opening = gallery.style.display === 'none';

  gallery.style.display = opening ? 'block' : 'none';

  if (opening) renderVideos();

}



/* PANIER */

let cart = {};

const euro = n => n.toLocaleString('fr-FR', {
  style:'currency',
  currency:'EUR',
  maximumFractionDigits:0
});


/* NAVIGATION */

function show(id) {

  ['home','catalog','cart'].forEach(x => {

    const section = document.getElementById(x);

    if (section) {
      section.classList.toggle('hidden', x !== id);
    }

  });

}

function goHome() {
  show('home');
}


/* CATÉGORIES */

function showCategory(name) {

  if (!data[name]) {
    console.error('Catégorie introuvable :', name);
    return;
  }

  show('catalog');

  document.getElementById('catTitle').textContent =
    name.toUpperCase();

  document.getElementById('products').innerHTML =

  data[name].map((x,i) => `

    <div class="product">

      <div>

        <b>${x.w}</b>

        <div class="price">
          ${euro(x.p)} ${x.emoji || ''}
        </div>

      </div>

      <div class="qty">

        <button onclick="change('${name}',${i},-1)">
          −
        </button>

        <span id="q-${i}">
          ${cart[name+'|'+i] || 0}
        </span>

        <button onclick="change('${name}',${i},1)">
          +
        </button>

      </div>

    </div>

  `).join('') +

  '<button class="primary" onclick="showCart()">VOIR MON PANIER</button>';

}


/* MODIFICATION QUANTITÉS */

function change(name,i,d) {

  const key = name+'|'+i;

  cart[key] = Math.max(
    0,
    (cart[key] || 0) + d
  );

  if (!cart[key]) delete cart[key];

  const quantity = document.getElementById('q-'+i);

  if (quantity) {
    quantity.textContent = cart[key] || 0;
  }

  updateCount();

}


/* COMPTEUR PANIER */

function updateCount() {

  document.getElementById('cartCount').textContent =

    Object.values(cart).reduce((a,b) => a+b, 0);

}


/* AFFICHAGE PANIER */

function showCart() {

  show('cart');

  let total = 0;

  const entries = Object.entries(cart);

  document.getElementById('cartItems').innerHTML =

  entries.length ? entries.map(([key,q]) => {

    const [name,index] = key.split('|');

    const item = data[name][Number(index)];

    const sum = item.p*q;

    total += sum;

    return `

      <div class="cart-row">

        <div class="product"
        style="border:0;padding:0;margin:0">

          <div>

            <b>${name} · ${item.w}</b>

            <div class="price">
              ${euro(item.p)} / unité
            </div>

          </div>

          <div class="qty">

            <button onclick="cartChange('${key}',-1)">
              −
            </button>

            <span>${q}</span>

            <button onclick="cartChange('${key}',1)">
              +
            </button>

          </div>

        </div>

        <div style="
        display:flex;
        justify-content:space-between;
        margin-top:14px">

          <b>${euro(sum)}</b>

          <button class="remove"
          onclick="removeItem('${key}')">
            ×
          </button>

        </div>

      </div>

    `;

  }).join('') :

  '<div class="empty">Ton panier est vide pour le moment.</div>';

  document.getElementById('total').textContent =
    'Total : ' + euro(total);

}
document.getElementById('cartItems').innerHTML += `
  <button class="primary" onclick="sendOrderTelegram()">
    ✈️ ENVOYER MA COMMANDE À BLG INDUSTRY
  </button>
`;
function sendOrderTelegram() {
  const entries = Object.entries(cart);

  if (!entries.length) {
    alert('Ton panier est vide !');
    return;
  }

  let message = '🥷 NOUVELLE COMMANDE BLG INDUSTRY 🥷\n\n';
  let total = 0;

  entries.forEach(([key, q]) => {
    const [name, index] = key.split('|');
    const item = data[name][Number(index)];
    const sum = item.p * q;

    total += sum;

    message += `${name}\n`;
    message += `${item.w} x ${q} = ${euro(sum)}\n\n`;
  });

  message += `💰 TOTAL : ${euro(total)}`;

  const url = 'https://t.me/blgindustry1?text=' +
    encodeURIComponent(message);

  window.open(url, '_blank');
}

/* MODIFICATION PANIER */

function cartChange(key,d) {

  cart[key] = Math.max(0,cart[key]+d);

  if (!cart[key]) delete cart[key];

  updateCount();

  showCart();

}


/* SUPPRESSION PRODUIT */

function removeItem(key) {

  delete cart[key];

  updateCount();

  showCart();

}

</script>

</body>
</html>
