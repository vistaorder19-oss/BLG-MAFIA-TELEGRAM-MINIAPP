<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">

<title>DBZ SC 19 | No1 Sur le Secteur</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">

<style>

/* =========================================
   VARIABLES GLOBALES
========================================= */

:root {
  color-scheme: dark;
  --red: #e01924;
  --dbz-orange: #ff7900;
  --dbz-yellow: #ffd52a;
  --dbz-blue: #087bd5;
}

* {
  box-sizing: border-box;
  font-family: 'Black Ops One', cursive !important;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: transparent !important;
}

body {
  color: white;
  position: relative;
  isolation: isolate;
}

/* =========================================
   VIDÉO D'ARRIÈRE-PLAN
========================================= */

#bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
  pointer-events: none;
}

/* =========================================
   STRUCTURE PRINCIPALE
========================================= */

main {
  position: relative;
  z-index: 1;
  max-width: 620px;
  min-height: 100vh;
  margin: auto;
  padding: 12px 18px 100px;
  background: transparent !important;
}
/* Espace en haut pour laisser apparaître le logo */
#home {
  padding-top: 130px;
}
header {
  text-align: center;
  padding: 20px 14px;
  background: transparent !important;
}

header img {
  width: min(190px,55vw);
  height: auto;
}

h1 {
  font-size: 32px;
  font-weight: 400;
  letter-spacing: 3px;
  text-align: center;
  color: var(--dbz-yellow);
  text-transform: uppercase;
  margin: 12px 0 6px;
  text-shadow:
    0 0 8px #ff7900,
    0 0 22px #ff7900;
}

.sub,
.section-title {
  color: var(--dbz-yellow);
  letter-spacing: 2px;
  font-size: 15px;
}

.section-title {
  margin: 18px 0;
  text-shadow: 0 0 10px rgba(255,213,42,.4);
}

/* =========================================
   CATÉGORIES
========================================= */

.category {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  width: 100%;
  min-height: 82px;
  padding: 22px 75px 22px 18px;
  margin: 10px 0;

  border: 1.5px solid var(--dbz-orange);
  border-radius: 17px;

  background: linear-gradient(
    120deg,
    rgba(16,41,75,.88),
    rgba(16,21,34,.88),
    rgba(64,32,11,.88)
  );

  color: white;
  text-align: left;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;

  box-shadow:
    0 0 12px rgba(255,121,0,.2),
    inset 0 0 15px rgba(8,123,213,.12);

  transition: .25s ease;
}

.category:active {
  transform: scale(.97);
  box-shadow: 0 0 22px var(--dbz-yellow);
}

.category span {
  float: right;
  color: var(--dbz-yellow);
  font-size: 24px;
}

/* Boules de cristal */

.category::before {
  content: "★";
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);

  width: 43px;
  height: 43px;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #d92712;
  font-size: 17px;

  background: radial-gradient(
    circle at 30% 25%,
    #fff5ae,
    #ffbd36 25%,
    #ff7900 65%,
    #b52c00
  );

  border: 2px solid #ffe078;

  box-shadow:
    0 0 10px #ff9d00,
    0 0 22px #ff7900;

  animation: dragonBallFloat 2.5s ease-in-out infinite;
}

/* =========================================
   CATALOGUE
========================================= */

.back {
  background: none;
  border: 0;
  color: var(--dbz-orange);
  padding: 12px 0;
  font-weight: bold;
  cursor: pointer;
}

#products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 15px;
}

/* =========================================
   CARTES PRODUITS
========================================= */

.product,
.cart-row {
  min-width: 0;

  background: linear-gradient(
    145deg,
    rgba(20,39,71,.90),
    rgba(16,21,34,.90) 65%,
    rgba(38,23,13,.90)
  );

  border: 1.5px solid rgba(255,121,0,.8);
  border-radius: 17px;

  padding: 14px 10px;
  margin: 10px 0;

  box-shadow:
    0 0 12px rgba(255,121,0,.16),
    inset 0 0 15px rgba(8,123,213,.1);

  animation: superSaiyanAura 4s ease-in-out infinite;
}

.product {
  min-height: 145px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: stretch;
  gap: 14px;
}

.product > div:first-child {
  text-align: center;
  font-size: 16px;
}

.price {
  color: var(--dbz-yellow);
  font-weight: bold;
  margin-top: 6px;
}

/* =========================================
   QUANTITÉS
========================================= */

.qty {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
}

.qty button,
.remove {
  width: 34px;
  height: 34px;

  border: 1px solid #36a9ff;
  border-radius: 10px;

  background: linear-gradient(
    135deg,
    #087bd5,
    #064b91
  );

  color: white;
  font-size: 20px;
  cursor: pointer;
}

/* =========================================
   BOUTONS
========================================= */

.primary {
  padding: 14px;
  border-radius: 7px;
  background: var(--red);
  border: 0;
  color: white;
  width: 100%;
  font-weight: bold;
  margin-top: 12px;
  cursor: pointer;
}

.total {
  text-align: right;
  font-size: 22px;
  font-weight: bold;
  margin: 20px 2px;
  color: var(--dbz-yellow);
}

.empty,
.notice {
  color: #ccc;
  text-align: center;
}

.notice {
  position: relative;
  z-index: 1;
  font-size: 11px;
  line-height: 1.5;
  margin: 28px 5px;
}

/* =========================================
   VIDÉOS PRODUITS
========================================= */

.video-section,
.video-card {
  background: rgba(20,39,71,.90);
  border: 1.5px solid var(--dbz-orange);
  border-radius: 17px;
  box-shadow: 0 0 14px rgba(255,121,0,.2);
}

.video-card {
  padding: 10px;
  margin: 12px 0;
  animation: superSaiyanAura 4s ease-in-out infinite;
}

.video-card video {
  display: block;
  width: 100%;
  max-height: 520px;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  background: black;
  border: 1px solid var(--dbz-blue);
  border-radius: 12px;
}

.video-name {
  font-weight: bold;
  letter-spacing: 1px;
  margin: 10px 2px 3px;
}

.video-empty {
  color: #ccc;
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
  padding: 14px 8px;
}

/* =========================================
   CONTACT
========================================= */

.contact-btn,
.product-video {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 17px;
  margin: 18px 0;

  border: 1.5px solid var(--dbz-blue);
  border-radius: 16px;

  background: rgba(16,43,74,.92);
  color: white;
  text-decoration: none;
  font-weight: bold;
  letter-spacing: 1px;
  text-align: center;

  box-shadow: 0 0 14px rgba(8,123,213,.25);
}

.contact-btn span,
.product-video span {
  color: #70cfff;
  font-size: 14px;
}

/* =========================================
   NAVIGATION
========================================= */

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 5;

  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 10px 8px;

  background: rgba(5,12,25,.97);
  border-top: 2px solid var(--dbz-orange);

  box-shadow:
    0 -5px 22px rgba(255,121,0,.2);
}

.navbtn {
  background: none;
  border: 0;
  border-radius: 12px;
  color: white;
  padding: 10px 14px;
  cursor: pointer;
}

.navbtn b {
  color: var(--dbz-yellow);
}

.hidden {
  display: none !important;
}

/* =========================================
   ANIMATIONS
========================================= */

@keyframes superSaiyanAura {
  0%, 100% {
    box-shadow: 0 0 8px rgba(255,121,0,.15);
  }

  50% {
    box-shadow:
      0 0 17px rgba(255,213,42,.3),
      0 0 24px rgba(8,123,213,.16);
  }
}

@keyframes dragonBallFloat {
  0%, 100% {
    translate: 0 0;
    filter: brightness(1);
  }

  50% {
    translate: 0 -5px;
    filter: brightness(1.35);
  }
}

/* =========================================
   PETITS ÉCRANS
========================================= */

@media (max-width: 360px) {
  #products {
    gap: 8px;
  }

  .product {
    padding: 10px 7px;
  }

  .qty {
    gap: 5px;
  }
}

</style>
</head>

<body>

<!-- VIDÉO DE FOND -->

<video id="bg-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
  <source src="videos/blg-logo.MP4" type="video/mp4">
</video>

<main>

<!-- =========================================
     ACCUEIL
========================================= -->

<section id="home">

  <div class="section-title">
    CHOISIS TA CONS'
  </div>

  <button type="button" class="category"
  onclick="showCategory('🧽 TOP MOUSSE 🧽')">
    🧽 TOP MOUSSE 🧽 <span>›</span>
  </button>

  <button type="button" class="category"
  onclick="showCategory('🦂 Filtré 90u 🦂')">
    🦂 Filtré 90u 🦂 <span>›</span>
  </button>

  <button type="button" class="category"
  onclick="showCategory('🍀 La Beuh 🍀')">
    🍀 La Beuh 🍀 <span>›</span>
  </button>

  <button type="button" class="category"
  onclick="toggleVideos()">
    📹 VIDÉOS PRODUITS HD 📹 <span>›</span>
  </button>

  <div id="videoGallery" style="display:none"></div>

  <a class="contact-btn"
  href="https://t.me/blgindustry1"
  target="_blank"
  rel="noopener">

    ✈️ CONTACT TELEGRAM ✈️
    <span>@blgindustry1</span>

  </a>

  <a class="product-video"
  href="https://t.me/+AvKneA-itAQyZDE0"
  target="_blank"
  rel="noopener">

    🥷📹 CANAL VIDÉO 📹🥷
    <span>CANAL TELEGRAM</span>

  </a>

</section>

<!-- =========================================
     CATALOGUE
========================================= -->

<section id="catalog" class="hidden">

  <button class="back" onclick="goHome()">
    ‹ RETOUR
  </button>

  <div class="section-title" id="catTitle"></div>

  <div id="products"></div>

</section>

<!-- =========================================
     PANIER
========================================= -->

<section id="cart" class="hidden">

  <button class="back" onclick="goHome()">
    ‹ RETOUR À LA BOUTIQUE
  </button>

  <div class="section-title">
    MON PANIER
  </div>

  <div id="cartItems"></div>

  <div class="total" id="total"></div>

</section>

<p class="notice">
  Produits vérifiés.
  Vente réservée aux adultes.
</p>

</main>

<!-- =========================================
     NAVIGATION BASSE
========================================= -->

<nav>

  <button class="navbtn" onclick="goHome()">
    🏬 <b>Boutique</b>
  </button>

  <button class="navbtn" onclick="showCart()">
    🛒 <b>Panier</b>
    (<span id="cartCount">0</span>)
  </button>

</nav>

<script>

/* =========================================
   CATALOGUE
========================================= */

const data = {

  '🧽 TOP MOUSSE 🧽': [
    {w:'3,3g',p:20},
    {w:'10 g',p:60},
    {w:'25 g',p:140},
    {w:'50 g',p:240},
    {w:'100g',p:380}
  ],

  '🦂 Filtré 90u 🦂': [
    {w:'2g',p:20},
    {w:'6g',p:50},
    {w:'10g',p:90},
    {w:'25g',p:220},
    {w:'50g',p:380},
    {w:'100g',p:500}
  ],

  '🍀 La Beuh 🍀': [
    {w:'≈3g',p:20},
    {w:'6g',p:40},
    {w:'10g',p:70},
    {w:'25g',p:240},
    {w:'50g',p:350},
    {w:'100g',p:400}
  ]

};

/* =========================================
   VIDÉOS
========================================= */

const productVideos = [

  {
    title: '🦂Filtré 90u🦂',
    subtitle: '🍬Gelato41 🏔️MMF',
    src: 'videos/Gelato41.MP4'
  },

  {
    title: 'Restock en cours',
    subtitle: 'Sold Out',
    src: 'videos/Sold Out BLG.MP4'
  }

];

function renderVideos() {

  const box = document.getElementById('videoGallery');

  if (!box) return;

  if (!productVideos.length) {

    box.innerHTML = `
      <div class="video-empty">
        Les vidéos arriveront ici.<br><br>
        Tout arrivage sera affiché ici 🥷
      </div>
    `;

    return;
  }

  box.innerHTML = productVideos.map(v => `

    <article class="video-card">

      <video controls playsinline preload="metadata">

        <source src="${v.src}" type="video/mp4">

        Ton navigateur ne peut pas lire cette vidéo.

      </video>

      <div class="video-name">
        ${v.title}
      </div>

      <div class="sub">
        ${v.subtitle}
      </div>

    </article>

  `).join('');

}

function toggleVideos() {

  const gallery = document.getElementById('videoGallery');

  if (!gallery) return;

  const opening = gallery.style.display === 'none';

  gallery.style.display = opening ? 'block' : 'none';

  if (opening) renderVideos();

}

/* =========================================
   PANIER
========================================= */

let cart = {};

const euro = n => n.toLocaleString('fr-FR', {
  style: 'currency',
  currency: 'EUR',
  maximumFractionDigits: 0
});

/* =========================================
   NAVIGATION
========================================= */

function show(id) {

  ['home','catalog','cart'].forEach(x => {

    const section = document.getElementById(x);

    if (section) {
      section.classList.toggle('hidden', x !== id);
    }

  });

}

function goHome() {
  show('home');
}

/* =========================================
   CATÉGORIES
========================================= */

function showCategory(name) {

  if (!data[name]) {
    console.error('Catégorie introuvable :', name);
    return;
  }

  show('catalog');

  document.getElementById('catTitle').textContent =
    name.toUpperCase();

  document.getElementById('products').innerHTML =

  data[name].map((x,i) => `

    <div class="product">

      <div>

        <b>${x.w}</b>

        <div class="price">
          ${euro(x.p)} ${x.emoji || ''}
        </div>

      </div>

      <div class="qty">

        <button onclick="change('${name}',${i},-1)">
          −
        </button>

        <span id="q-${i}">
          ${cart[name+'|'+i] || 0}
        </span>

        <button onclick="change('${name}',${i},1)">
          +
        </button>

      </div>

    </div>

  `).join('') +

  '<button class="primary" onclick="showCart()">VOIR MON PANIER</button>';

}

/* =========================================
   MODIFICATION QUANTITÉS
========================================= */

function change(name,i,d) {

  const key = name+'|'+i;

  cart[key] = Math.max(
    0,
    (cart[key] || 0) + d
  );

  if (!cart[key]) delete cart[key];

  const quantity = document.getElementById('q-'+i);

  if (quantity) {
    quantity.textContent = cart[key] || 0;
  }

  updateCount();

}

/* =========================================
   COMPTEUR PANIER
========================================= */

function updateCount() {

  document.getElementById('cartCount').textContent =

    Object.values(cart).reduce((a,b) => a+b, 0);

}

/* =========================================
   AFFICHAGE PANIER
========================================= */

function showCart() {

  show('cart');

  let total = 0;

  const entries = Object.entries(cart);

  document.getElementById('cartItems').innerHTML =

  entries.length ? entries.map(([key,q]) => {

    const [name,index] = key.split('|');

    const item = data[name][Number(index)];

    const sum = item.p*q;

    total += sum;

    return `

      <div class="cart-row">

        <div class="product"
        style="border:0;padding:0;margin:0">

          <div>

            <b>${name} · ${item.w}</b>

            <div class="price">
              ${euro(item.p)} / unité
            </div>

          </div>

          <div class="qty">

            <button onclick="cartChange('${key}',-1)">
              −
            </button>

            <span>${q}</span>

            <button onclick="cartChange('${key}',1)">
              +
            </button>

          </div>

        </div>

        <div style="
        display:flex;
        justify-content:space-between;
        margin-top:14px">

          <b>${euro(sum)}</b>

          <button class="remove"
          onclick="removeItem('${key}')">
            ×
          </button>

        </div>

      </div>

    `;

  }).join('') :

  '<div class="empty">Ton panier est vide pour le moment.</div>';

  document.getElementById('total').textContent =
    entries.length ? 'TOTAL : ' + euro(total) : '';

  if (entries.length) {

    document.getElementById('cartItems').innerHTML += `

      <button class="primary" onclick="sendOrderTelegram()">
        ✈️ Envoyer À DBZ Social Club19
      </button>

    `;

  }

}

/* =========================================
   ENVOI TELEGRAM
========================================= */

function sendOrderTelegram() {

  const entries = Object.entries(cart);

  if (!entries.length) {
    alert('Ton panier est vide !');
    return;
  }

  let message = '🥷 Commande DBZ Social Club 🥷\n\n';

  let total = 0;

  entries.forEach(([key,q]) => {

    const [name,index] = key.split('|');

    const item = data[name][Number(index)];

    const sum = item.p*q;

    total += sum;

    message += `${name}\n`;
    message += `${item.w} x ${q} = ${euro(sum)}\n\n`;

  });

  message += `💰 TOTAL : ${euro(total)}`;

  const url = 'https://t.me/blgindustry1?text=' +
    encodeURIComponent(message);

  window.open(url, '_blank');

}

/* =========================================
   MODIFICATION PANIER
========================================= */

function cartChange(key,d) {

  cart[key] = Math.max(0,cart[key]+d);

  if (!cart[key]) delete cart[key];

  updateCount();

  showCart();

}

/* =========================================
   SUPPRESSION PRODUIT
========================================= */

function removeItem(key) {

  delete cart[key];

  updateCount();

  showCart();

}

</script>

</body>
</html>
